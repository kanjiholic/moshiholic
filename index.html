<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOSHIHOLIC - 漢検模試成績管理＆誤答ノート</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js CDN (レーダーチャート用) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            red: '#C8102E',
                            darkred: '#9B0B21',
                            bg: '#FDFBF7',
                            card: '#FFFFFF',
                            text: '#2C2C2C',
                            accent: '#D4AF37'
                        }

            }

    <style>
        body { background-color: #FDFBF7; color: #2C2C2C; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }

<body class="min-h-screen flex flex-col justify-between">

        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <img src="./KANJIHOLICRAVEN_logo.png" alt="KANJIHOLIC Logo" class="w-10 h-10 rounded-full border-2 border-white object-cover shadow-sm" onerror="this.src='https://via.placeholder.com/40?text=KH'">
                <div>
                    <h1 class="text-xl font-bold tracking-wider leading-none">MOSHIHOLIC</h1>
                    <p class="text-xs text-red-100 mt-0.5">漢検1級・準1級 模試成績管理</p>

    <!-- Main Content Area -->

        <!-- Status Banner -->

        </div>

        <!-- TAB 1: INPUT / EDIT FORM -->
        <section id="view-input" class="space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <div class="flex justify-between items-center border-b pb-2 mb-4">
                    <h2 id="formHeaderTitle" class="text-lg font-bold text-brand-red flex items-center gap-2">

                    <button id="cancelEditBtn" onclick="resetFormState()" class="hidden text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1.5 rounded-lg transition">

                </div>
                
                <input type="hidden" id="editingRecordId" value="">

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">受検級</label>

                            <option value="pre1">準1級 (全10問 / 200点満点)</option>

                    <div>

                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">模試名・回数</label>
                        <input type="text" id="examTitle" placeholder="例: 第1回 過去問2023" class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-red focus:outline-none">
                    </div>
                </div>

                <div class="mb-6">

                        <span>大問別得点</span>
                        <span id="scoreSummary" class="text-brand-red text-base font-extrabold">合計: 0 / 200 点 (0%)</span>
                    </h3>
                    <div id="sectionInputsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
                </div>

                <div class="mb-6 bg-gray-50 p-4 rounded-lg border border-gray-200">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-sm font-bold text-gray-700 flex items-center gap-1">
                            <i class="fa-solid fa-circle-exclamation text-brand-red"></i> 誤答問題の登録
                        </h3>
                        <button onclick="addErrorRow()" class="text-xs bg-brand-red hover:bg-brand-darkred text-white px-3 py-1.5 rounded-lg transition flex items-center gap-1 shadow-sm">
                            <i class="fa-solid fa-plus"></i> 問題を追加
                        </button>
                    </div>
                    <div id="errorRowsContainer" class="space-y-3"></div>
                </div>

                <button id="saveBtn" onclick="saveExamRecord()" class="w-full bg-brand-red hover:bg-brand-darkred text-white font-bold py-3 px-4 rounded-xl shadow-md transition duration-200 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i> <span id="saveBtnText">この模試結果を保存する</span>
                </button>
            </div>
        </section>

        <!-- TAB 2: HISTORY -->
        <section id="view-history" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h2 class="text-lg font-bold text-brand-red mb-4 flex items-center justify-between border-b pb-2">
                    <span><i class="fa-solid fa-clock-rotate-left"></i> 模試結果一覧</span>
                    <span id="recordCount" class="text-xs font-normal text-gray-500">全 0 件</span>
                </h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 border-b text-xs text-gray-600">
                                <th class="p-3">日付</th>
                                <th class="p-3">級</th>
                                <th class="p-3">模試名</th>
                                <th class="p-3">得点</th>
                                <th class="p-3">大問別内訳</th>
                                <th class="p-3">合否目安</th>
                                <th class="p-3 text-center">操作</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody" class="text-sm divide-y"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- TAB 3: ERROR NOTE -->
        <section id="view-errors" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b pb-4 mb-4">
                    <div>
                        <h2 class="text-lg font-bold text-brand-red flex items-center gap-2">
                            <i class="fa-solid fa-book-open"></i> 誤答データベース
                        </h2>
                        <p class="text-xs text-gray-500 mt-1">蓄積された間違えた問題を絞り込み・閲覧・Anki用に書き出しできます。</p>
                    </div>
                    <button onclick="exportAnkiCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2.5 rounded-lg shadow transition flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-file-csv"></i> Anki用CSVエクスポート
                    </button>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6 bg-gray-50 p-3 rounded-lg border border-gray-200">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">級絞り込み</label>
                        <select id="filterGrade" onchange="renderErrorList()" class="w-full p-2 border border-gray-300 rounded-lg text-xs focus:ring-brand-red focus:outline-none">
                            <option value="all">すべての級</option>
                            <option value="1">1級</option>
                            <option value="pre1">準1級</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">分野（大問）絞り込み</label>
                        <select id="filterSection" onchange="renderErrorList()" class="w-full p-2 border border-gray-300 rounded-lg text-xs focus:ring-brand-red focus:outline-none">
                            <option value="all">すべての分野</option>
                        </select>
                    </div>
                </div>

                <div id="errorCardsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>
        </section>

    </main>

    <!-- MODAL: EXAM DETAILS & RADAR CHART -->
    <div id="detailModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-2xl max-w-3xl w-full p-6 shadow-2xl relative my-8 max-h-[90vh] overflow-y-auto">
            <button onclick="closeDetailModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl font-bold w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100">
                &times;
            </button>

            <div class="border-b pb-4 mb-4">
                <div class="flex items-center gap-2 mb-1">
                    <span id="modalGradeBadge" class="px-2 py-0.5 rounded text-xs font-bold"></span>
                    <span id="modalExamDate" class="text-xs text-gray-500"></span>
                </div>
                <h2 id="modalExamTitle" class="text-xl font-bold text-gray-800"></h2>
                <div id="modalScoreSummary" class="text-2xl font-extrabold text-brand-red mt-1"></div>
            </div>

            <!-- Radar Chart Area -->
            <div class="mb-6 bg-gray-50 p-4 rounded-xl border border-gray-100 flex flex-col items-center">
                <h3 class="text-sm font-bold text-gray-700 mb-2 w-full text-left flex items-center gap-1.5">
                    <i class="fa-solid fa-chart-pie text-brand-red"></i> 得点率分析 (レーダーチャート)
                </h3>
                <div class="w-full max-w-md h-72">
                    <canvas id="radarChartCanvas"></canvas>
                </div>
            </div>

            <!-- Section Breakdowns -->
            <div class="mb-6">
                <h3 class="text-sm font-bold text-gray-700 mb-2 flex items-center gap-1.5">
                    <i class="fa-solid fa-list-check text-brand-red"></i> 大問別明細
                </h3>
                <div id="modalSectionGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-2 text-xs"></div>
            </div>

            <!-- Wrong Questions List -->
            <div class="mb-6">
                <h3 class="text-sm font-bold text-gray-700 mb-2 flex items-center gap-1.5">
                    <i class="fa-solid fa-circle-exclamation text-brand-red"></i> 登録された誤答問題
                </h3>
                <div id="modalErrorList" class="space-y-2"></div>
            </div>

            <!-- Footer Actions -->
            <div class="flex justify-end gap-3 border-t pt-4">
                <button id="modalEditBtn" class="bg-brand-red hover:bg-brand-darkred text-white text-xs font-bold px-4 py-2 rounded-lg transition flex items-center gap-1.5">
                    <i class="fa-solid fa-pen-to-square"></i> この成績を修正する
                </button>
                <button onclick="closeDetailModal()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 text-xs font-bold px-4 py-2 rounded-lg transition">
                    閉じる
                </button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-100 border-t border-gray-200 text-center py-4 text-xs text-gray-500 mt-8">
        <p>&copy; MOSHIHOLIC / KANJIHOLIC Project</p>
    </footer>

    <!-- Firebase SDK (v10 modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ★★★ Firebaseの設定情報をここに貼り付けてください ★★★
  const firebaseConfig = {
    apiKey: "AIzaSyBHOsJw7Y6ID_VBuzBCOTHBhpjlYmhUYMM",
    authDomain: "moshiholic-5202f.firebaseapp.com",
    projectId: "moshiholic-5202f",
    storageBucket: "moshiholic-5202f.firebasestorage.app",
    messagingSenderId: "538913867255",
    appId: "1:538913867255:web:bb744b68a0fe2c73931af2"
  };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let unsubscribeFirestore = null;

        window.loginWithGoogle = async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (err) {
                alert("ログインに失敗しました: " + err.message);
            }
        };

        window.logoutGoogle = async () => {
            if (confirm("ログアウトしますか？")) {
                await signOut(auth);
            }
        };

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const loginBtn = document.getElementById('loginBtn');
            const userProfile = document.getElementById('userProfile');
            const userAvatar = document.getElementById('userAvatar');
            const syncStatus = document.getElementById('syncStatus');

            if (user) {
                loginBtn.classList.add('hidden');
                userProfile.classList.remove('hidden');
                userAvatar.src = user.photoURL || 'https://via.placeholder.com/30';
                syncStatus.className = "mb-4 p-3 bg-green-50 border border-green-200 rounded-lg text-xs text-green-800 flex items-center justify-between";
                syncStatus.innerHTML = `<span><i class="fa-solid fa-cloud-check mr-1"></i> Googleログイン中 (${user.displayName})。クラウドとリアルタイム同期しています。</span>`;

                const userDocRef = doc(db, "users", user.uid);
                unsubscribeFirestore = onSnapshot(userDocRef, (docSnap) => {
                    if (docSnap.exists()) {
                        window.records = docSnap.data().records || [];
                    } else {
                        syncToCloud();
                    }
                    window.refreshAllViews();
                });

            } else {
                if (unsubscribeFirestore) unsubscribeFirestore();
                loginBtn.classList.remove('hidden');
                userProfile.classList.add('hidden');
                syncStatus.className = "mb-4 p-3 bg-amber-50 border border-amber-200 rounded-lg text-xs text-amber-800 flex items-center justify-between";
                syncStatus.innerHTML = `<span><i class="fa-solid fa-circle-info mr-1"></i> 現在はブラウザのローカル保存モードです。Googleログインすると端末間でデータが自動同期されます。</span>`;

                window.records = JSON.parse(localStorage.getItem('moshiholic_records')) || [];
                window.refreshAllViews();
            }
        });

        window.saveData = async () => {
            if (currentUser) {
                await syncToCloud();
            } else {
                localStorage.setItem('moshiholic_records', JSON.stringify(window.records));
            }
        };

        async function syncToCloud() {
            if (!currentUser) return;
            const userDocRef = doc(db, "users", currentUser.uid);
            await setDoc(userDocRef, { records: window.records, updatedAt: new Date() }, { merge: true });
        }
    </script>

    <!-- App Logic -->
    <script>
        const EXAM_SPECS = {
            "1": [
                { id: 1, name: "（一）読み", max: 30 },
                { id: 2, name: "（二）書き取り", max: 40 },
                { id: 3, name: "（三）語選択書き取り", max: 10 },
                { id: 4, name: "（四）四字熟語", max: 30 },
                { id: 5, name: "（五）熟字訓・当て字", max: 10 },
                { id: 6, name: "（六）熟語の読み・一字訓読", max: 10 },
                { id: 7, name: "（七）対義語・類義語", max: 20 },
                { id: 8, name: "（八）故事・成語・諺", max: 20 },
                { id: 9, name: "（九）文章題", max: 30 }
            ],
            "pre1": [
                { id: 1, name: "（一）読み", max: 30 },
                { id: 2, name: "（二）表外の読み", max: 10 },
                { id: 3, name: "（三）熟語の読み・一字訓読", max: 10 },
                { id: 4, name: "（四）共通の漢字", max: 10 },
                { id: 5, name: "（五）書き取り", max: 40 },
                { id: 6, name: "（六）誤字訂正", max: 10 },
                { id: 7, name: "（七）四字熟語", max: 30 },
                { id: 8, name: "（八）対義語・類義語", max: 20 },
                { id: 9, name: "（九）故事・成語・諺", max: 20 },
                { id: 10, name: "（十）文章題", max: 20 }
            ]
        };

        window.records = JSON.parse(localStorage.getItem('moshiholic_records')) || [];
        let radarChartInstance = null;

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('examDate').valueAsDate = new Date();
            renderScoreInputs();
            updateFilterSectionOptions();
            refreshAllViews();
        });

        window.refreshAllViews = () => {
            renderHistoryTable();
            renderErrorList();
        };

        function switchTab(tabName) {
            ['input', 'history', 'errors'].forEach(t => {
                document.getElementById(`view-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}`).classList.remove('tab-active');
                document.getElementById(`tab-${t}`).classList.add('text-gray-500');
            });

            document.getElementById(`view-${tabName}`).classList.remove('hidden');
            const activeTab = document.getElementById(`tab-${tabName}`);
            activeTab.classList.add('tab-active');
            activeTab.classList.remove('text-gray-500');

            if (tabName === 'history') renderHistoryTable();
            if (tabName === 'errors') {
                updateFilterSectionOptions();
                renderErrorList();
            }
        }

        function renderScoreInputs() {
            const grade = document.getElementById('examGrade').value;
            const container = document.getElementById('sectionInputsContainer');
            container.innerHTML = '';

            EXAM_SPECS[grade].forEach(sec => {
                const div = document.createElement('div');
                div.className = "flex items-center justify-between bg-gray-50 p-2.5 rounded-lg border border-gray-200";
                div.innerHTML = `
                    <span class="text-xs font-semibold text-gray-700">${sec.name} <span class="text-gray-400">(${sec.max}点)</span></span>
                    <input type="number" min="0" max="${sec.max}" data-sec-id="${sec.id}" data-max="${sec.max}" value="" placeholder="0" 
                        oninput="validateAndCalculate(this)" class="score-input w-20 p-1.5 text-right border border-gray-300 rounded font-bold focus:ring-1 focus:ring-brand-red focus:outline-none">
                `;
                container.appendChild(div);
            });

            document.getElementById('errorRowsContainer').innerHTML = '';
            addErrorRow();
            calculateTotal();
        }

        // 大問ごとの上限点数チェック＆自動補正
        function validateAndCalculate(input) {
            const max = parseInt(input.dataset.max, 10);
            let val = parseInt(input.value, 10);

            if (val > max) {
                input.value = max;
            } else if (val < 0) {
                input.value = 0;
            }
            calculateTotal();
        }

        function calculateTotal() {
            const inputs = document.querySelectorAll('.score-input');
            let total = 0;
            inputs.forEach(input => {
                const val = parseInt(input.value) || 0;
                total += val;
            });
            const pct = Math.round((total / 200) * 100);
            document.getElementById('scoreSummary').innerText = `合計: ${total} / 200 点 (${pct}%)`;
        }

        function addErrorRow(secIdVal = '', qVal = '', aVal = '', memoVal = '') {
            const grade = document.getElementById('examGrade').value;
            const container = document.getElementById('errorRowsContainer');
            const rowId = Date.now() + Math.random();

            let optionsHtml = EXAM_SPECS[grade].map(s => `<option value="${s.id}" ${s.id == secIdVal ? 'selected' : ''}>${s.name}</option>`).join('');

            const row = document.createElement('div');
            row.id = `error-row-${rowId}`;
            row.className = "grid grid-cols-1 sm:grid-cols-12 gap-2 bg-white p-3 rounded-lg border border-gray-200 relative shadow-sm";
            row.innerHTML = `
                <div class="sm:col-span-3">
                    <select class="err-sec w-full p-1.5 border border-gray-300 rounded text-xs focus:outline-none">
                        ${optionsHtml}
                    </select>
                </div>
                <div class="sm:col-span-3">
                    <input type="text" placeholder="問題 (例: 𠮟咤)" value="${escapeHtml(qVal)}" class="err-q w-full p-1.5 border border-gray-300 rounded text-xs focus:outline-none">
                </div>
                <div class="sm:col-span-3">
                    <input type="text" placeholder="正解 (例: しった)" value="${escapeHtml(aVal)}" class="err-a w-full p-1.5 border border-gray-300 rounded text-xs focus:outline-none">
                </div>
                <div class="sm:col-span-2">
                    <input type="text" placeholder="メモ" value="${escapeHtml(memoVal)}" class="err-memo w-full p-1.5 border border-gray-300 rounded text-xs focus:outline-none">
                </div>
                <div class="sm:col-span-1 flex justify-end items-center">
                    <button onclick="removeErrorRow('error-row-${rowId}')" class="text-gray-400 hover:text-brand-red p-1"><i class="fa-solid fa-trash"></i></button>
                </div>
            `;
            container.appendChild(row);
        }

        function removeErrorRow(id) {
            const row = document.getElementById(id);
            if (row) row.remove();
        }

        // 保存（新規・修正共通）
        async function saveExamRecord() {
            const date = document.getElementById('examDate').value;
            const title = document.getElementById('examTitle').value.trim();
            const grade = document.getElementById('examGrade').value;
            const editingId = document.getElementById('editingRecordId').value;

            if (!date || !title) {
                alert('実施日と模試名を入力してください。');
                return;
            }

            const scores = {};
            let totalScore = 0;
            document.querySelectorAll('.score-input').forEach(input => {
                const secId = input.dataset.secId;
                const max = parseInt(input.dataset.max, 10);
                let score = parseInt(input.value) || 0;
                if (score > max) score = max; // 念のため再チェック
                scores[secId] = score;
                totalScore += score;
            });

            const errors = [];
            document.querySelectorAll('#errorRowsContainer > div').forEach(row => {
                const secId = row.querySelector('.err-sec').value;
                const question = row.querySelector('.err-q').value.trim();
                const answer = row.querySelector('.err-a').value.trim();
                const memo = row.querySelector('.err-memo').value.trim();

                if (question || answer) {
                    errors.push({ secId: parseInt(secId), question, answer, memo });
                }
            });

            if (editingId) {
                // 既存レコードの更新
                const index = window.records.findIndex(r => r.id == editingId);
                if (index !== -1) {
                    window.records[index] = {
                        id: parseInt(editingId, 10),
                        date,
                        title,
                        grade,
                        scores,
                        totalScore,
                        errors
                    };
                }
                alert('模試結果を更新しました！');
            } else {
                // 新規作成
                const newRecord = {
                    id: Date.now(),
                    date,
                    title,
                    grade,
                    scores,
                    totalScore,
                    errors
                };
                window.records.unshift(newRecord);
                alert('模試結果を保存しました！');
            }

            await window.saveData();
            resetFormState();
            refreshAllViews();
        }

        // フォームのリセット（新規モードへ）
        function resetFormState() {
            document.getElementById('editingRecordId').value = '';
            document.getElementById('formHeaderTitle').innerHTML = '<i class="fa-solid fa-file-signature"></i> 模試結果の記録';
            document.getElementById('formTabLabel').innerText = '成績入力';
            document.getElementById('saveBtnText').innerText = 'この模試結果を保存する';
            document.getElementById('cancelEditBtn').classList.add('hidden');
            document.getElementById('examTitle').value = '';
            document.getElementById('examDate').valueAsDate = new Date();
            renderScoreInputs();
        }

        // 過去データを入力フォームに呼び出して「修正」
        function editRecord(id) {
            const rec = window.records.find(r => r.id == id);
            if (!rec) return;

            closeDetailModal();
            switchTab('input');

            document.getElementById('editingRecordId').value = rec.id;
            document.getElementById('formHeaderTitle').innerHTML = '<i class="fa-solid fa-pen-to-square"></i> 模試結果の修正';
            document.getElementById('formTabLabel').innerText = '成績修正中';
            document.getElementById('saveBtnText').innerText = '更新して保存する';
            document.getElementById('cancelEditBtn').classList.remove('hidden');

            document.getElementById('examGrade').value = rec.grade;
            document.getElementById('examDate').value = rec.date;
            document.getElementById('examTitle').value = rec.title;

            renderScoreInputs();

            // 大問スコアのセット
            document.querySelectorAll('.score-input').forEach(input => {
                const secId = input.dataset.secId;
                if (rec.scores && rec.scores[secId] !== undefined) {
                    input.value = rec.scores[secId];
                }
            });
            calculateTotal();

            // 誤答問題のセット
            const container = document.getElementById('errorRowsContainer');
            container.innerHTML = '';
            if (rec.errors && rec.errors.length > 0) {
                rec.errors.forEach(err => {
                    addErrorRow(err.secId, err.question, err.answer, err.memo);
                });
            } else {
                addErrorRow();
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 履歴テーブルの描画（大問別内訳カンマ区切りを表示）
        function renderHistoryTable() {
            const tbody = document.getElementById('historyTableBody');
            tbody.innerHTML = '';
            document.getElementById('recordCount').innerText = `全 ${window.records.length} 件`;

            if (window.records.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-gray-400 text-xs">登録された模試結果はありません。</td></tr>`;
                return;
            }

            window.records.forEach(rec => {
                const isPass = rec.totalScore >= 160;
                const gradeLabel = rec.grade === '1' ? '1級' : '準1級';
                const specs = EXAM_SPECS[rec.grade];

                // (a, b, c, ...) のカンマ区切り文字列を生成
                const scoreList = specs.map(s => rec.scores ? (rec.scores[s.id] ?? 0) : 0);
                const scoreString = `(${scoreList.join(', ')})`;

                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition cursor-pointer";
                tr.innerHTML = `
                    <td class="p-3 text-xs text-gray-500 whitespace-nowrap" onclick="openDetailModal(${rec.id})">${rec.date}</td>
                    <td class="p-3" onclick="openDetailModal(${rec.id})"><span class="px-2 py-0.5 rounded text-xs font-bold ${rec.grade==='1'?'bg-red-100 text-brand-red':'bg-blue-100 text-blue-700'}">${gradeLabel}</span></td>
                    <td class="p-3 font-semibold text-gray-800" onclick="openDetailModal(${rec.id})">${escapeHtml(rec.title)}</td>
                    <td class="p-3 font-extrabold ${isPass ? 'text-brand-red' : 'text-gray-700'}" onclick="openDetailModal(${rec.id})">${rec.totalScore} <span class="text-xs font-normal text-gray-400">/ 200</span></td>
                    <td class="p-3 text-xs font-mono text-gray-500 max-w-xs truncate" title="${scoreString}" onclick="openDetailModal(${rec.id})">${scoreString}</td>
                    <td class="p-3" onclick="openDetailModal(${rec.id})"><span class="px-2 py-0.5 rounded text-xs font-bold ${isPass ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'}">${isPass ? '合格圏内' : '目標まで' + (160 - rec.totalScore) + '点'}</span></td>
                    <td class="p-3 text-center whitespace-nowrap">
                        <button onclick="openDetailModal(${rec.id})" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-2 py-1 rounded mr-1" title="詳細"><i class="fa-solid fa-chart-pie"></i> 詳細</button>
                        <button onclick="editRecord(${rec.id})" class="text-xs bg-blue-50 hover:bg-blue-100 text-blue-600 px-2 py-1 rounded mr-1" title="修正"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deleteRecord(${rec.id})" class="text-gray-400 hover:text-red-600 p-1" title="削除"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 詳細モーダルを表示
        function openDetailModal(id) {
            const rec = window.records.find(r => r.id == id);
            if (!rec) return;

            const specs = EXAM_SPECS[rec.grade];
            const isPass = rec.totalScore >= 160;

            document.getElementById('modalExamTitle').innerText = rec.title;
            document.getElementById('modalExamDate').innerText = rec.date;
            document.getElementById('modalScoreSummary').innerText = `${rec.totalScore} / 200 点 (${Math.round((rec.totalScore/200)*100)}%) - ${isPass ? '合格圏内' : '不合格'}`;

            const badge = document.getElementById('modalGradeBadge');
            badge.innerText = rec.grade === '1' ? '1級' : '準1級';
            badge.className = `px-2 py-0.5 rounded text-xs font-bold ${rec.grade==='1'?'bg-red-100 text-brand-red':'bg-blue-100 text-blue-700'}`;

            document.getElementById('modalEditBtn').onclick = () => editRecord(rec.id);

            // 明細グリッド描画
            const grid = document.getElementById('modalSectionGrid');
            grid.innerHTML = '';
            specs.forEach(s => {
                const score = rec.scores ? (rec.scores[s.id] ?? 0) : 0;
                const pct = Math.round((score / s.max) * 100);
                const div = document.createElement('div');
                div.className = "bg-gray-50 p-2 rounded border border-gray-200 flex justify-between items-center";
                div.innerHTML = `
                    <span class="text-gray-600 truncate">${s.name}</span>
                    <span class="font-bold text-gray-800">${score}<span class="text-gray-400 font-normal">/${s.max}</span></span>
                `;
                grid.appendChild(div);
            });

            // 誤答一覧描画
            const errList = document.getElementById('modalErrorList');
            errList.innerHTML = '';
            if (rec.errors && rec.errors.length > 0) {
                rec.errors.forEach(err => {
                    const sec = specs.find(s => s.id === err.secId);
                    const secName = sec ? sec.name : '';
                    const div = document.createElement('div');
                    div.className = "bg-gray-50 p-3 rounded-lg border border-gray-200 text-xs";
                    div.innerHTML = `
                        <div class="font-bold text-brand-red mb-1">${secName}</div>
                        <div class="grid grid-cols-2 gap-2">
                            <div><span class="text-gray-400">問題:</span> <span class="font-bold text-gray-800">${escapeHtml(err.question)}</span></div>
                            <div><span class="text-gray-400">正解:</span> <span class="font-bold text-emerald-600">${escapeHtml(err.answer)}</span></div>
                        </div>
                        ${err.memo ? `<div class="text-gray-500 mt-1 bg-white p-1 rounded border border-gray-100">${escapeHtml(err.memo)}</div>` : ''}
                    `;
                    errList.appendChild(div);
                });
            } else {
                errList.innerHTML = `<div class="text-xs text-gray-400 italic">登録された誤答問題はありません。</div>`;
            }

            // レーダーチャート描画
            renderRadarChart(specs, rec.scores || {});

            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        // Chart.js レーダーチャート生成
        function renderRadarChart(specs, scores) {
            const ctx = document.getElementById('radarChartCanvas').getContext('2d');
            const labels = specs.map(s => s.name.replace(/（.）/, '')); // 簡略表示
            const dataRates = specs.map(s => {
                const score = scores[s.id] ?? 0;
                return Math.round((score / s.max) * 100);
            });

            if (radarChartInstance) {
                radarChartInstance.destroy();
            }

            radarChartInstance = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '得点率 (%)',
                        data: dataRates,
                        backgroundColor: 'rgba(200, 16, 46, 0.2)',
                        borderColor: '#C8102E',
                        borderWidth: 2,
                        pointBackgroundColor: '#C8102E'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            min: 0,
                            max: 100,
                            ticks: { stepSize: 20, display: false },
                            pointLabels: { font: { size: 10 } }
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }

        async function deleteRecord(id) {
            if (confirm('この記録を削除してもよろしいですか？')) {
                window.records = window.records.filter(r => r.id !== id);
                await window.saveData();
                refreshAllViews();
            }
        }

        function updateFilterSectionOptions() {
            const gradeFilter = document.getElementById('filterGrade').value;
            const secSelect = document.getElementById('filterSection');
            secSelect.innerHTML = '<option value="all">すべての分野</option>';

            let sections = (gradeFilter === 'all') ? [...EXAM_SPECS["1"], ...EXAM_SPECS["pre1"]] : EXAM_SPECS[gradeFilter];
            const addedNames = new Set();
            sections.forEach(s => {
                if (!addedNames.has(s.name)) {
                    addedNames.add(s.name);
                    const opt = document.createElement('option');
                    opt.value = s.name;
                    opt.textContent = s.name;
                    secSelect.appendChild(opt);
                }
            });
        }

        function renderErrorList() {
            const container = document.getElementById('errorCardsContainer');
            container.innerHTML = '';

            const gradeFilter = document.getElementById('filterGrade').value;
            const secFilter = document.getElementById('filterSection').value;

            let allErrors = [];
            window.records.forEach(rec => {
                if (gradeFilter !== 'all' && rec.grade !== gradeFilter) return;

                const spec = EXAM_SPECS[rec.grade];
                rec.errors.forEach(err => {
                    const secInfo = spec.find(s => s.id === err.secId);
                    const secName = secInfo ? secInfo.name : '不明';

                    if (secFilter !== 'all' && secName !== secFilter) return;

                    allErrors.push({
                        ...err,
                        secName,
                        examTitle: rec.title,
                        examDate: rec.date,
                        grade: rec.grade
                    });
                });
            });

            if (allErrors.length === 0) {
                container.innerHTML = `<div class="col-span-2 p-8 text-center text-gray-400 text-sm">該当する誤答データはありません。</div>`;
                return;
            }

            allErrors.forEach(err => {
                const card = document.createElement('div');
                card.className = "bg-gray-50 p-4 rounded-xl border border-gray-200 shadow-sm relative flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-bold px-2 py-0.5 rounded ${err.grade==='1'?'bg-red-100 text-brand-red':'bg-blue-100 text-blue-700'}">${err.grade==='1'?'1級':'準1級'}・${err.secName}</span>
                            <span class="text-xs text-gray-400">${err.examTitle} (${err.examDate})</span>
                        </div>
                        <div class="mb-2">
                            <div class="text-xs text-gray-500">問題</div>
                            <div class="text-base font-bold text-gray-800">${escapeHtml(err.question || '未入力')}</div>
                        </div>
                        <div class="mb-2">
                            <div class="text-xs text-gray-500">正解</div>
                            <div class="text-sm font-semibold text-brand-red">${escapeHtml(err.answer || '未入力')}</div>
                        </div>
                        ${err.memo ? `<div class="text-xs bg-white p-2 rounded border border-gray-200 text-gray-600 mt-2"><i class="fa-regular fa-note-sticky text-brand-red mr-1"></i>${escapeHtml(err.memo)}</div>` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function exportAnkiCSV() {
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
            csvContent += "問題,正解,分野・模試情報,メモ\n";

            let count = 0;
            window.records.forEach(rec => {
                const spec = EXAM_SPECS[rec.grade];
                rec.errors.forEach(err => {
                    const secInfo = spec.find(s => s.id === err.secId);
                    const secName = secInfo ? secInfo.name : '';
                    const info = `[${rec.grade==='1'?'1級':'準1級'}] ${secName} (${rec.title})`;

                    const q = `"${(err.question || '').replace(/"/g, '""')}"`;
                    const a = `"${(err.answer || '').replace(/"/g, '""')}"`;
                    const i = `"${info.replace(/"/g, '""')}"`;
                    const m = `"${(err.memo || '').replace(/"/g, '""')}"`;

                    csvContent += `${q},${a},${i},${m}\n`;
                    count++;
                });
            });

            if (count === 0) {
                alert('出力対象の誤答データが存在しません。');
                return;
            }

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `moshiholic_anki_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(window.records, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `moshiholic_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importJSON(event) {
            const fileReader = new FileReader();
            fileReader.onload = async function( e ) {
                try {
                    const importedRecords = JSON.parse(e.target.result);
                    if (Array.isArray(importedRecords)) {
                        if (confirm('現在のデータを上書きして復元しますか？')) {
                            window.records = importedRecords;
                            await window.saveData();
                            refreshAllViews();
                            alert('データの復元が完了しました。');
                        }
                    } else {
                        alert('無効なバックアップファイルフォーマットです。');
                    }
                } catch (err) {
                    alert('ファイルの読み込みに失敗しました。');
                }
            };
            fileReader.readAsText(event.target.files[0]);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
